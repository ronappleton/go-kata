let currentTrack=ALL_TRACKS[0],currentStage='all',fcIdx=0,fcFlipped=false;

// Track button clicks
document.querySelectorAll('.track-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.track-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTrack=ALL_TRACKS.find(t=>t.id===btn.dataset.track);
    currentStage='all';
    renderStageBar();
    renderStages();
  });
});

function renderStageBar(){
  const el=document.getElementById('stageBar');
  let html='<button class="mode-btn active" data-stage="all">All</button>';
  currentTrack.stages.forEach(s=>{
    html+='<button class="mode-btn" data-stage="'+s.id+'">'+s.title+'</button>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      el.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentStage=btn.dataset.stage;
      renderStages();
    });
  });
}

function renderStages(){
  const el=document.getElementById('stages');
  el.innerHTML='';
  currentTrack.stages.forEach(s=>{
    if(currentStage!=='all'&&s.id!==currentStage)return;
    const bc='badge-'+s.level;
    let cats='';
    s.categories.forEach(c=>{
      let ks='';
      c.kata_ids.forEach(id=>{
        const k=META[id];
        const name=k?k.title:'Kata '+id;
        const st=k?k.evaluator_status:'incomplete';
        const dc=st==='ready'?'dot-ready':'dot-incomplete';
        const tags=(k&&k.tags)?k.tags.slice(0,3).map(t=>'<span class="tag">'+t+'</span>').join(''):'';
        ks+='<li class="kata-item"><span class="kata-dot '+dc+'">&#9679;</span><span class="kata-id">'+id+'</span><span class="kata-name">'+name+'</span><span class="kata-tags">'+tags+'</span></li>';
      });
      cats+='<div class="category"><div class="cat-header"><span class="cat-title">'+c.title+'</span><span class="cat-count">'+c.kata_ids.length+' katas</span></div><ul class="kata-list">'+ks+'</ul></div>';
    });
    el.innerHTML+='<div class="stage"><div class="stage-header"><span class="stage-title">'+s.title+'</span><span class="badge '+bc+'">'+s.level.toUpperCase()+'</span><span class="stage-desc">'+s.description+'</span></div><div class="categories">'+cats+'</div></div>';
  });
}

function updateFC(){
  if(!ALL_FC.length)return;
  if(fcIdx>=ALL_FC.length)fcIdx=0;
  if(fcIdx<0)fcIdx=ALL_FC.length-1;
  fcFlipped=false;
  const fc=ALL_FC[fcIdx];
  document.getElementById('fcSide').textContent='FRONT';
  document.getElementById('fcText').textContent='['+fc.kataID+'] '+fc.front;
  document.getElementById('fcCounter').textContent=(fcIdx+1)+' / '+ALL_FC.length;
}
function fcFlip(){fcFlipped=!fcFlipped;const fc=ALL_FC[fcIdx];document.getElementById('fcSide').textContent=fcFlipped?'BACK':'FRONT';document.getElementById('fcText').textContent=fcFlipped?fc.back:'['+fc.kataID+'] '+fc.front;}
function fcNext(){fcIdx++;updateFC();}
function fcPrev(){fcIdx--;updateFC();}

// Init
renderStageBar();
renderStages();
updateFC();
</script></body></html>
