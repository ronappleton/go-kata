name: Build and Release

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  GO_VERSION: '1.25'

jobs:

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config libgtk-4-dev
        env:
          DEBIAN_FRONTEND: noninteractive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          mkdir -p dist/linux-amd64
          CGO_ENABLED=1 go build -trimpath -tags gtk4 -o dist/linux-amd64/gokatas ./apps/learner-desktop/
      - name: Test
        run: go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: gokatas-linux-amd64
          path: dist/linux-amd64/

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4
        run: brew install gtk4 pkg-config
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: |
          mkdir -p dist/macos-arm64
          CGO_ENABLED=1 go build -trimpath -tags gtk4 -o dist/macos-arm64/gokatas ./apps/learner-desktop/
      - name: Test
        run: go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: gokatas-macos-arm64
          path: dist/macos-arm64/

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-go
      - name: Build
        run: |
          mkdir -p dist/windows-amd64
          export PATH="/mingw64/bin:$PATH"
          CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -trimpath -tags gtk4 -o dist/windows-amd64/gokatas.exe ./apps/learner-desktop/
      - name: Test
        run: |
          export PATH="/mingw64/bin:$PATH"
          go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: gokatas-windows-amd64
          path: dist/windows-amd64/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz dist/**/*.zip
          generate_release_notes: true
